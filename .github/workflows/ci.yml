name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: CLI smoke test
        env:
          PPR_OUT: ${{ runner.temp }}/ppr
        run: |
          ppr --version
          ppr modules
          ppr doctor . --port 8765
          ppr docs .
          ppr hunt -- python -c "print('hello')"
          ppr register verify
      - name: Pain map doc is current
        run: python scripts/gen_pain_points_md.py --check

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck install.sh
        run: shellcheck install.sh

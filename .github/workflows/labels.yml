name: labels

on:
  push:
    branches: [main]
    paths: [".github/labels.json"]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = require('./.github/labels.json');
            const { owner, repo } = context.repo;
            for (const l of labels) {
              try {
                await github.rest.issues.updateLabel({ owner, repo, name: l.name, color: l.color, description: l.description });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ owner, repo, ...l });
              }
            }
